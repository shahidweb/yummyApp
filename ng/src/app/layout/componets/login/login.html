<div class="modal">
    <form #loginForm="ngForm" class="space-y-4" (ngSubmit)="onSubmit(loginForm)">
        @if(!isLogin) {
        <input
            class="mt-3 border border-gray-400 placeholder:text-gray-400 focus:border-orange-600 focus:outline-none w-full p-2 rounded mb-2"
            placeholder="Your name" [(ngModel)]="login.name" name="name" />
        }
        <input
            class="mt-3 border border-gray-400 placeholder:text-gray-400 focus:border-orange-600 focus:outline-none w-full p-2 rounded mb-2"
            placeholder="email" [(ngModel)]="login.email" name="email" required />
        <input
            class="mt-3 border border-gray-400 placeholder:text-gray-400 focus:border-orange-600 focus:outline-none w-full p-2 rounded mb-2"
            placeholder="password" [(ngModel)]="login.password" name="password" required />
        <button class="bg-orange-600 w-full px-5 py-3 mt-3 text-white font-medium cursor-pointer">
            {{isLogin ? "Login" : "Create Account"}}
        </button>
    </form>
    <div class="cursor-pointer mt-3 mb-10">
        <input id="agreement"
            class="cursor-pointer h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500 me-3"
            type="checkbox" />
        <label htmlFor="agreement" class="cursor-pointer">
            By continuing, I agree to the terms of use & privacy policy
        </label>
    </div>
    <p>
        {{isLogin ? "Create a account? " : "Already have an account? "}}
        <span class="cursor-pointer text-orange-600 font-medium" (click)="isLogin=!isLogin">
            {{isLogin ? "Login" : "Click"}} here
        </span>
    </p>
</div>
