<div id="top-filter">
    <h1 class="font-bold text-gray-900 text-3xl mt-5">Explore or menu</h1>
    <p class="text-gray-900 lg:w-3/5 mt-3">
        Choose from a diverse menu featuring a delectable array of dishes. Our
        mission is to satisfy your cravings and elavate your dining experience,
        one delicious meal at a time
    </p>
    <ul class="flex items-center gap-6 mt-5 overflow-x-auto scrollbar-hide">
        @for ( item of filters; track item.id ) {
        <li key={item.id} class="text-center cursor-pointer" (click)="selectedId = selectedId !== item.id ? item.id: 0">
            <img class="w-20 h-20 md:w-full md:h-full object-cover mb-3 rounded-full hover:border-orange-600
                hover:border-3" [ngClass]="selectedId===item.id ? 'border-3 border-orange-600' : '' " src={{item.img}}
                alt={{item.name}} width="100px" />
            <span class="text-gray-600">{{item.name}}</span>
        </li>
        }
    </ul>
    <hr class="my-5 text-gray-300 border" />
</div>
